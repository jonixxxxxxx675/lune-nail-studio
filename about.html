<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LUNE Nail Studio — про студію">
  <title>Про нас — LUNE Nail Studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #f4e7e2; color: #201816; }
    .about-page { min-height: 100vh; padding: 130px 6vw 80px; }
    .about-page__nav { display:flex; justify-content:space-between; align-items:center; margin-bottom:60px; }
    .about-page__back { color:#201816; font-size:14px; }
    .about-page__grid { display:grid; grid-template-columns:1.15fr .85fr; gap:50px; align-items:stretch; }
    .about-page__hero { min-height:620px; border-radius:28px; overflow:hidden; position:relative; }
    .about-page__hero img { width:100%; height:100%; object-fit:cover; display:block; }
    .about-page__copy { padding:55px 20px; display:flex; flex-direction:column; justify-content:center; }
    .about-page__copy .eyebrow { color:#8c7168; }
    .about-page__title { font-family:var(--ff-head); font-weight:400; font-size:clamp(52px,6vw,96px); line-height:.95; text-transform:uppercase; margin:22px 0 28px; }
    .about-page__lead { max-width:580px; color:#6f5e58; line-height:1.7; font-size:17px; }
    .about-page__photo { margin-top:38px; width:100%; max-width:620px; border-radius:22px; display:block; }
    @media (max-width:899px) {
      .about-page { display:none; }
    }
  </style>
</head>
<body>
  <main class="about-page">
    <div class="about-page__nav">
      <a href="index.html#hero" class="logo" aria-label="LUNE Nail Studio">
        <span class="logo__word">LUNE</span>
        <span class="logo__sub">NAIL STUDIO</span>
      </a>
      <a href="index.html#hero" class="about-page__back">← На головну</a>
    </div>

    <div class="about-page__grid">
      <div class="about-page__hero">
        <img src="assets/images/about.jpg" alt="Атмосфера студії LUNE" width="1920" height="620">
      </div>

      <div class="about-page__copy">
        <p class="eyebrow eyebrow--dark">ПРО НАС</p>
        <h1 class="about-page__title">АТМОСФЕРА,<br>В ЯКУ ХОЧЕТЬСЯ<br>ПОВЕРТАТИСЬ</h1>
        <p class="about-page__lead">
          LUNE — це простір, де краса поєднується з комфортом.
          Ми створюємо спокійну атмосферу, уважний сервіс і деталі,
          до яких хочеться повертатися знову.
        </p>
        <img class="about-page__photo" src="assets/images/about-2.jpg" alt="Інтер'єр LUNE Nail Studio" width="520" height="360">
      </div>
    </div>
  </main>
</body>
</html>
